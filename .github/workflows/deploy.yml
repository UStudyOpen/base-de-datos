name: Prepare approved Pages deployment
# No push trigger. Activation requires explicit authorization, a repository variable,
# the protected main branch and the github-pages environment's required reviewer.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLICAR to request an authorized deployment'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ vars.USO_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLICAR' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install verified Quarto 1.10.18
        run: python3 tests/install_quarto.py
      - name: Validate metadata and source integrity
        run: python3 tests/platform_validate.py --source-only
      - name: Build from an isolated source copy
        run: python3 tests/render_clean.py
      - name: Course regression checks
        run: python3 tests/run_course.py
      - name: Validate publishable HTML, resources and routes
        run: python3 tests/platform_validate.py --release
      # Official Pages artifact format, without a composite's floating transitive action.
      - name: Archive validated site
        run: tar --directory _site --create --file "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    if: ${{ vars.USO_PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLICAR' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
