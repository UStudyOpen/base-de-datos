    uso-text: "#243247"
    uso-heading: "#182b49"
    uso-muted: "#58677b"
    uso-primary: "#2563eb"
    uso-on-primary: "#ffffff"
    uso-primary-hover: "#1d4ed8"
    uso-link: "#1d4ed8"
    uso-primary-soft: "#eff6ff"
    uso-emphasis: "#147d78"
    uso-emphasis-soft: "#e7f4f2"
    uso-success: "#18734b"
    uso-warning: "#98620a"
    uso-danger: "#c03642"
