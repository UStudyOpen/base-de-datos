title: UStudyOpen Design
author: UStudyOpen
version: 0.3.0
quarto-required: ">=1.10.18 <1.11.0"
contributes:
  formats:
    html:
      theme:
        light: [default, brand, scss/uso.scss]
        dark: [default, brand, scss/uso.scss]
      respect-user-color-scheme: true
      toc: true
      toc-location: right-body
      toc-title: En esta página
      toc-depth: 3
      code-copy: true
      code-overflow: scroll
      html-math-method:
        method: mathjax
        url: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js
      filters:
        - filters/status.lua
      smooth-scroll: false
      anchor-sections: true
      include-after-body: assets/after-body.html
